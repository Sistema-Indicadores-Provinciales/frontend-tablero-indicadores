# Use the container DNS so this works with both Compose and Railway's private network.
# These services bind IPv4; new Railway environments provide private IPv4 records.
resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
upstream indicators_api {
  zone indicators_api 64k;
  server ${API_UPSTREAM} resolve;
}
upstream indicators_analytics {
  zone indicators_analytics 64k;
  server ${ANALYTICS_UPSTREAM} resolve;
}
# Enable only behind a trusted edge that sets these headers (Railway does).
map "${TRUST_PROXY_HEADERS}:$http_x_real_ip" $request_client {
  default $binary_remote_addr;
  ~^1:(?<edge_client_ip>.+)$ $edge_client_ip;
}
map "${TRUST_PROXY_HEADERS}:$http_x_forwarded_proto" $request_protocol {
  default $scheme;
  "1:https" https;
  "1:http" http;
}
limit_req_zone $request_client zone=login:10m rate=5r/m;
limit_req_zone $request_client zone=analytics:10m rate=2r/s;
server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 26m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
  location = /api/auth/login {
    limit_req zone=login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://indicators_api/auth/login;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $request_protocol;
  }
  location /api/ {
    proxy_pass http://indicators_api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $request_protocol;
    proxy_read_timeout 90s;
  }
  location /analytics/ {
    limit_req zone=analytics burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://indicators_analytics/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $request_protocol;
    proxy_read_timeout 90s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
